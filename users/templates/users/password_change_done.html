{% extends 'workouts/base.html' %}

{% block content %}
<style>
    /* Стили для выразительной кнопки возврата */
    .rt-back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        background-color: #1E293B;
        border: 1px solid #334155;
        color: #E2E8F0;
        border-radius: 8px;
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 20px;
        transition: all 0.2s ease;
    }

    .rt-back-btn:hover {
        background-color: #334155;
        color: #FFFFFF;
        border-color: #475569;
    }

    /* Переопределяем ширину и отступы карточки для этого экрана, чтобы было просторно */
    .wf-card-success {
        max-width: 480px;
        margin: 40px auto;
        padding: 36px;
    }
</style>

<div class="wf-wrapper">
    <div class="wf-card wf-card-success">
        <!-- Шапка карточки с кнопкой возврата -->
        <div class="wf-header" style="margin-bottom: 24px;">
            <a href="{% url 'workout_list' %}" class="rt-back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px;">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                На главную
            </a>
            <div class="wf-eyebrow">Успешно</div>
            <h1 class="wf-title" style="font-size: 28px; margin-top: 4px;">Пароль <span>изменен</span></h1>
        </div>
        
        <!-- Сообщение об успехе с нормальными отступами -->
        <div style="text-align: center; margin-bottom: 32px; color: #94A3B8; line-height: 1.6; font-size: 15px;">
            Ваш пароль был успешно обновлен!<br>
            Теперь вы можете использовать его для входа в свой аккаунт.
        </div>

        <!-- Кнопка-ссылка для возврата в профиль -->
        <a href="{% url 'profile' %}" class="wf-submit" style="text-decoration: none; display: flex; justify-content: center; align-items: center; gap: 8px; box-sizing: border-box; width: 100%; margin: 0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Вернуться в профиль
        </a>
    </div>
</div>
{% endblock %}
