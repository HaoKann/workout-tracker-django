{% extends 'workouts/base.html' %}

{% block content %}
<div class="wf-wrapper">
    <div class="wf-card">
        <!-- Шапка карточки -->
        <div class="wf-header">
            <div class="wf-eyebrow">Успешно</div>
            <h1 class="wf-title">Пароль <span>изменен</span></h1>
        </div>
        
        <!-- Сообщение об успехе -->
        <div style="text-align: center; margin-bottom: 30px; color: #a1a1aa; line-height: 1.5;">
            Ваш пароль был успешно обновлен!<br>
            Теперь вы можете использовать его для входа в свой аккаунт.
        </div>

        <!-- Кнопка-ссылка для возврата -->
        <a href="{% url 'profile' %}" class="wf-submit" style="text-decoration: none; display: flex; justify-content: center; align-items: center; gap: 8px;">
            <!-- Иконка галочки -->
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Вернуться в профиль
        </a>
    </div>
</div>
{% endblock %}
