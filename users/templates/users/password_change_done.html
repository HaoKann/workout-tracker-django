{% extends 'workouts/base.html' %}

{% block content %}
<style>
    .pcd-container {
        max-width: 640px;
        margin: 0 auto;
    }

    .pcd-card {
        background: linear-gradient(145deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.95));
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 36px 32px 32px;
        box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.45);
        text-align: center;
    }

    .pcd-icon-badge {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px auto;
        border-radius: 50%;
        background: rgba(16, 185, 129, 0.14);
        border: 1px solid rgba(16, 185, 129, 0.35);
        color: #34D399;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 24px rgba(16, 185, 129, 0.15);
    }

    .pcd-eyebrow {
        color: #34D399;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 6px;
    }

    .pcd-title {
        margin: 0 0 12px 0;
        font-size: 26px;
        font-weight: 700;
        color: #F8FAFC;
    }

    .pcd-title span {
        color: #3B82F6;
    }

    .pcd-message {
        margin: 0 auto 28px auto;
        max-width: 420px;
        color: #94A3B8;
        font-size: 14px;
        line-height: 1.6;
    }

    .pcd-actions {
        display: flex;
        gap: 12px;
        padding-top: 20px;
        border-top: 1px solid rgba(51, 65, 85, 0.6);
    }

    .pcd-btn {
        flex: 1;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        padding: 11px 16px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s ease;
        box-sizing: border-box;
    }

    .pcd-btn--primary {
        background: #3B82F6;
        color: #FFFFFF;
        border: 1px solid #3B82F6;
    }

    .pcd-btn--primary:hover {
        background: #2563EB;
    }

    .pcd-btn--secondary {
        background: rgba(30, 41, 59, 0.8);
        color: #E2E8F0;
        border: 1px solid #334155;
    }

    .pcd-btn--secondary:hover {
        background: #334155;
        color: #FFFFFF;
    }

    @media (max-width: 520px) {
        .pcd-actions {
            flex-direction: column;
        }
    }
</style>

<div class="pcd-container">
    <div class="pcd-card">
        <div class="pcd-icon-badge">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>

        <div class="pcd-eyebrow">Готово</div>
        <h1 class="pcd-title">Пароль <span>изменён</span></h1>
        <p class="pcd-message">
            Ваш пароль успешно обновлён. Теперь вы можете использовать его для входа в аккаунт.
        </p>

        <div class="pcd-actions">
            <a href="{% url 'profile' %}" class="pcd-btn pcd-btn--primary">
                👤 Вернуться в профиль
            </a>
            <a href="{% url 'workout_list' %}" class="pcd-btn pcd-btn--secondary">
                🏠 На главную
            </a>
        </div>
    </div>
</div>
{% endblock %}
