{% extends 'workouts/base.html' %} 

{% block content %}
<style>
    /* Стили для нижней ссылки авторизации */
    .wf-auth-footer {
        text-align: center;
        margin-top: 18px;
        font-size: 14px;
        color: #94A3B8;
    }

    .wf-auth-footer a {
        color: #60A5FA;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.2s ease;
    }

    .wf-auth-footer a:hover {
        color: #93C5FD;
        text-decoration: underline;
    }
</style>

<div class="wf-wrapper">
    <div class="wf-card">
        
        <!-- Шапка страницы -->
        <div class="wf-header">
            <div class="wf-eyebrow">Workout Tracker</div>
            <h2 class="wf-title"><span>Регистрация</span></h2>
        </div>
        
        <!-- Форма регистрации -->
        <form method="POST" class="wf-form">
            {% csrf_token %}
            
            {% for field in form %}
                <div class="wf-field {% if field.errors %}wf-field--error{% endif %}">
                    <label class="wf-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    
                    {{ field }}
                    
                    {% if field.errors %}
                        <div class="wf-error">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            
            <button type="submit" class="wf-submit" style="margin-top: 8px;">
                Зарегистрироваться
            </button>
            
            <!-- Аккуратный футер для перехода на вход -->
            <div class="wf-auth-footer">
                Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
            </div>
            
        </form>
    </div>
</div>
{% endblock %}
