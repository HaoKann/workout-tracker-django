{% extends 'workouts/base.html' %}
{% load static %}

{% block content %}

<style>
    /* Стиль для выразительной кнопки возврата */
    .rt-back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        background-color: #1E293B;
        border: 1px solid #334155;
        color: #E2E8F0;
        border-radius: 8px;
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 16px;
        transition: all 0.2s ease;
    }

    .rt-back-btn:hover {
        background-color: #334155;
        color: #FFFFFF;
        border-color: #475569;
    }
</style>

<div class="wf-card">
    <div class="wf-header">
        <!-- Кнопка возврата на главную сверху -->
        <a href="{% url 'workout_list' %}" class="rt-back-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px;">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            На главную
        </a>

        <!-- Умный надзаголовок -->
        <p class="wf-eyebrow">
            {% if object %}Редактирование{% else %}Добавление{% endif %}
        </p>
        
        <!-- Умный заголовок -->
        <h2 class="wf-title">
            {% if object %}Изменить <span>рутину</span>{% else %}Новая <span>рутина</span>{% endif %}
        </h2>
    </div>

    <form method="post" class="wf-form">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="wf-submit">
            <!-- Показываем иконку плюса только если это создание новой рутины -->
            {% if not object %}
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            {% endif %}
            
            <!-- Меняем текст кнопки -->
            {% if object %}Сохранить изменения{% else %}Сохранить рутину{% endif %}
        </button>
    </form>
</div>

{% endblock %}
