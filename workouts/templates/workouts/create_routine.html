{% extends 'workouts/base.html' %}
{% load static %}

{% block content %}

<div class="wf-card">
    <div class="wf-header">
        <!-- Умный надзаголовок -->
        <p class="wf-eyebrow">
            {% if object %}Редактирование{% else %}Добавление{% endif %}
        </p>
        
        <!-- Умный заголовок -->
        <h2 class="wf-title">
            {% if object %}Изменить <span>рутину</span>{% else %}Новая <span>рутина</span>{% endif %}
        </h2>
    </div>

    <form method="post" class="wf-form">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="wf-submit">
            <!-- Показываем иконку плюса только если это создание новой рутины -->
            {% if not object %}
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            {% endif %}
            
            <!-- Меняем текст кнопки -->
            {% if object %}Сохранить изменения{% else %}Сохранить рутину{% endif %}
        </button>
    </form>

    <div style="padding: 0 36px 32px;">
        <a href="{% url 'workout_routines' %}" style="color: #64748B; text-decoration: none; font-size: 14px;">← Назад к списку</a>
    </div>
</div>

{% endblock %}
